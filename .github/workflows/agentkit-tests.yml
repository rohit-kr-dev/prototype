name: AgentKit Python Tests

on:
  push:
    branches: [hackerrank-agentkit-prep]
    paths:
      - "hackerrank-agentkit/**"
      - ".github/workflows/agentkit-tests.yml"
  pull_request:
    paths:
      - "hackerrank-agentkit/**"
      - ".github/workflows/agentkit-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackerrank-agentkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -p "test*.py" -v
